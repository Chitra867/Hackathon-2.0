version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upacharkhoj_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-upacharkhoj-dev-secret-key-change-in-production
      - DB_ENGINE=django.db.backends.sqlite3
      - DB_NAME=/app/db.sqlite3
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOW_ALL_ORIGINS=True
    networks:
      - upacharkhoj_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upacharkhoj_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - upacharkhoj_network

networks:
  upacharkhoj_network:
    driver: bridge
